name: Feature request
description: Suggest an improvement to the School Year integration
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: I understand that only Skellefteå grundskola is currently supported.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the household workflow or limitation this should address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the integration should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing Home Assistant features or workarounds you considered.
